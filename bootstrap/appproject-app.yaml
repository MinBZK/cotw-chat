apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cotw-app
  namespace: cotw-argocd
spec:
  description: cotw chat
  destinations:
  - name: in-cluster
    namespace: cotw-*
    server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - https://github.com/MinBZK/cotw-chat.git
