apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - postgres.yaml

# Argo CD sync waves: credentials, then the CNPG Cluster (Argo's built-in
# postgresql.cnpg.io/Cluster health check holds this wave until Postgres is ready).
patches:
  - patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-database
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
  - patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: keycloak
        annotations:
          argocd.argoproj.io/sync-wave: "-1"

helmCharts:
  - name: keycloakx
    repo: oci://ghcr.io/codecentric/helm-charts/
    version: 7.3.2
    releaseName: keycloak
    valuesFile: values.yaml
